[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-mcp"
version = "0.1.0"
description = "Multimodal RAG MCP knowledge-base server (folder-scoped, evidence-traceable)"
requires-python = ">=3.10"
dependencies = [
  "zvec>=0.7.0",
  "mcp>=1.9",
  "httpx>=0.27",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=0.6.23",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "PyYAML>=6.0",
  "charset-normalizer>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]
raganything = ["raganything>=1.4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
timeout = 300
testpaths = ["tests"]
