<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkillHub 状态</title>
<style>
:root {
  --bg: #f6f7fb; --card: #ffffff; --ink: #1a2233; --muted: #5b6478; --line: #e5e8f0;
  --brand: #4f46e5; --ok: #059669;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -12px rgba(16,24,40,.12);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.65 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 20px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 36px; box-shadow: var(--shadow); text-align: center; }
.status-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); margin-right: 8px; vertical-align: middle; animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
h1 { margin: 0 0 24px; font-size: 22px; }
.row { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; margin-top: 20px; }
.cell { font-size: 14px; color: var(--muted); }
.cell b { display: block; font-size: 18px; color: var(--ink); font-weight: 700; margin-bottom: 4px; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
footer { text-align: center; padding: 24px 0; font-size: 12.5px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap" style="padding-top:80px;padding-bottom:40px;">
  <div class="card">
    <h1><span class="status-dot"></span>SkillHub 状态</h1>
    <p style="color:var(--muted);margin:0 0 8px;font-size:14px;">所有系统运行正常</p>
    <div class="row">
      <div class="cell"><b id="clock">--</b>当前时间</div>
      <div class="cell"><b>正常</b>服务状态</div>
      <div class="cell"><b id="uptime">--</b>启动时间</div>
    </div>
  </div>
  <footer><a href="/">← 返回首页</a></footer>
</div>
<script>
(function(){
  const BOOT = Date.now();
  function pad(n){ return String(n).padStart(2,'0'); }
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
  const secs = Math.floor((Date.now() - BOOT) / 1000);
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60);
  document.getElementById('uptime').textContent = h + 'h' + m + 'm';
})();
</script>
</body>
</html>
