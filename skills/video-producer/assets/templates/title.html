<div class="vpx-title vpx-anim-fade-up">
  <div class="vpx-title-main">{{title}}</div>
  {{#sub}}<div class="vpx-title-sub">{{sub}}</div>{{/sub}}
</div>
<style>
  .vpx-title {
    position: absolute;
    left: 0;
    right: 0;
    top: 38%;
    text-align: center;
    font-family: var(--vpx-font, 'WenQuanYi Zen Hei', sans-serif);
    color: var(--vpx-overlay-ink, #fff);
    text-shadow: 0 2px 14px var(--vpx-overlay-shadow, rgba(26, 23, 16, 0.55));
  }
  .vpx-title-main {
    font-size: var(--vpx-title-size, 64px);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .vpx-title-sub {
    margin-top: 14px;
    font-size: var(--vpx-title-sub-size, 30px);
    font-weight: 400;
    opacity: 0.92;
    letter-spacing: 0.12em;
  }
  .vpx-anim-fade-up {
    animation: vpx-fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .vpx-anim-fade-up .vpx-title-sub {
    animation: vpx-fade-up 0.9s 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes vpx-fade-up {
    from { opacity: 0; transform: translateY(28px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
