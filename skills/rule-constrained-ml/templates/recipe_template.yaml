# ============================================================================
# 配方模板 (recipe template) —— 复制后填写你的业务
# 明规则在这里声明; 幅度系数由数据训练。详见 references/recipe_spec.md
# ============================================================================
name: your_model_name            # 英文/下划线, 决定生成文件名 model_<name>.py
description: 一句话描述这个"规则约束下的机器学习"要解决什么。

output:
  id: target                      # 因变量列名(CSV 中需同名)
  floor: 0                        # 硬地板: 最终输出 >= floor (可设为 null 关闭)

inputs:
  # ---- 类型三选一: ordinal(有序档) / numeric(连续) / binary(0/1) ----
  # ---- 符号三选一: positive(>=0 冻结) / negative(<=0 受限) / free(无约束) ----
  - id: feature_a
    label: 特征A
    type: ordinal
    base: 1                        # 编码为 max(x - base, 0)
    levels: 5                      # 档位数(用于扫描范围)
    sign: positive                 # 该因素对输出"同向"(越大输出越大)
  - id: feature_b
    label: 特征B
    type: numeric
    knee: 35                       # 可选膝点: 编码为 max(x - knee, 0); 删去则直接用 x
    range: [0, 100]                # 可选扫描/外推范围
    sign: positive
  - id: feature_c
    label: 特征C(拖累项)
    type: binary
    sign: negative                 # 受限: 系数 <= 0, 训练也不会翻正
  # - id: feature_d
  #   label: 特征D(纯数据)
  #   type: numeric
  #   sign: free                   # 无约束, 慎用(放弃可解释保障)
